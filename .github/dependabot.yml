version: 2
updates:
  # The workflow's actions (pinned to commits; Dependabot bumps the commit and the version comment).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Swift packages. There are none yet; this picks them up once Package.swift gains dependencies.
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
