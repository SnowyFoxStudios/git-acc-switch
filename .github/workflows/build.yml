name: Build

# Every push and PR builds the app. Pushing a tag like v0.1.0 also publishes a GitHub Release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Pick version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Build universal app
        run: ./scripts/build-app.sh

      - name: Check the bundle
        run: |
          APP=build/GitAccountSwitch.app
          lipo -archs "$APP/Contents/MacOS/GitAccountSwitch"
          codesign --verify --strict "$APP"
          plutil -extract CFBundleShortVersionString raw "$APP/Contents/Info.plist"
          "$APP/Contents/MacOS/GitAccountSwitch" help

      - name: Package
        run: |
          mkdir -p dist
          ZIP="dist/GitAccountSwitch-$VERSION.zip"
          # ditto keeps the bundle's symlinks, permissions and signature intact.
          ditto -c -k --sequesterRsrc --keepParent build/GitAccountSwitch.app "$ZIP"
          (cd dist && shasum -a 256 "$(basename "$ZIP")" > "$(basename "$ZIP").sha256")
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: GitAccountSwitch-${{ env.VERSION }}
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sed "s/{{VERSION}}/$VERSION/g" .github/release-notes.md > dist/notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 \
            --title "GitAccountSwitch $VERSION" \
            --notes-file dist/notes.md \
            --generate-notes \
            --verify-tag
